<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon MMORPG Web</title>
    <style>
        body { 
            margin: 0; 
            background: #111; 
            color: white; 
            text-align: center; 
            font-family: 'Arial', sans-serif; 
            overflow: hidden;
        }

        /* Menu Principal */
        #mainMenu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #444;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            width: 320px;
        }

        .menu-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            background: #28a745;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .menu-btn:hover { background: #218838; transform: scale(1.03); }
        .btn-secondary { background: #4a5568; }
        .btn-secondary:hover { background: #3b4252; }
        
        .btn-return {
            background: #dc3545;
            color: white;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .btn-return:hover { background: #c82333; }

        #gameArea { display: none; margin-top: 20px; }
        canvas { background: #222; border: 2px solid #555; display: block; margin: 10px auto; image-rendering: pixelated; }
        
        .modal {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            border: 2px solid #555;
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
            z-index: 10;
            width: 320px;
        }

        .modal-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-confirm-yes {
            background: #dc3545;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 50%;
        }

        .btn-confirm-no {
            background: #6c757d;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 50%;
        }

        .option-group {
            margin: 15px 0;
            text-align: left;
        }
        .option-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #aaa;
        }
        .option-group select, .option-group input[type="color"] {
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #333;
            color: white;
            font-size: 16px;
        }
        #previewCanvas {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            margin: 10px auto;
            display: block;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>

    <!-- ÉCRAN D'ACCUEIL -->
    <div id="mainMenu">
        <h1>⚔️ MYTHIC ONLINE</h1>
        <p>Entrez dans la légende</p>

        <button class="menu-btn" onclick="startGame()">▶️ JOUER</button>
        <button class="menu-btn btn-secondary" onclick="openModal('characterModal')">👤 PERSONNAGE</button>
        <button class="menu-btn btn-secondary" onclick="openModal('settingsModal')">⚙️ RÉGLAGES</button>
    </div>

    <!-- CONFIRMATION QUITTER -->
    <div id="confirmExitModal" class="modal">
        <h2>⚠️ Confirmation</h2>
        <p>Es-tu sûr de vouloir retourner au menu principal ?</p>
        <div class="modal-buttons">
            <button class="btn-confirm-yes" onclick="confirmExit()">Oui, quitter</button>
            <button class="btn-confirm-no" onclick="closeModal('confirmExitModal')">Non, rester</button>
        </div>
    </div>

    <!-- PERSONNALISATION DU PERSONNAGE -->
    <div id="characterModal" class="modal">
        <h2>👤 Choix du Skin</h2>
        
        <canvas id="previewCanvas" width="96" height="112"></canvas>

        <div class="option-group">
            <label>Modèle de Personnage :</label>
            <select id="genderSelect" onchange="updateCharacterConfig()">
                <option value="kazuma">Kazuma (Aventurier)</option>
                <option value="aqua">Aqua (Déesse / Fille)</option>
            </select>
        </div>

        <div class="option-group">
            <label>Couleur du Vêtement / Cape :</label>
            <input type="color" id="jacketColor" value="#2b7a78" onchange="updateCharacterConfig()">
        </div>

        <button class="menu-btn" onclick="closeModal('characterModal')">💾 Valider</button>
    </div>

    <!-- RÉGLAGES -->
    <div id="settingsModal" class="modal">
        <h2>⚙️ Réglages</h2>
        <p>Options audio et vidéo (À venir)</p>
        <button class="menu-btn btn-secondary" onclick="closeModal('settingsModal')">Fermer</button>
    </div>

    <!-- ZONE DE JEU -->
    <div id="gameArea">
        <button class="btn-return" onclick="askExit()">🏠 Retour au Menu</button>
        <canvas id="gameCanvas" width="600" height="400"></canvas>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let charConfig = {
            gender: 'kazuma',
            jacketColor: '#2b7a78'
        };

        function updateCharacterConfig() {
            charConfig.gender = document.getElementById('genderSelect').value;
            charConfig.jacketColor = document.getElementById('jacketColor').value;
            drawPreview();
            
            if (socket && myId && players[myId]) {
                players[myId].config = charConfig;
                socket.emit('playerMovement', { x: players[myId].x, y: players[myId].y, config: charConfig });
            }
        }

        // DESSIN DES SKINS PIXEL ART (Kazuma & Aqua)
        function drawPixelSprite(ctx, x, y, config, scale = 1.5) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            const mainColor = config ? config.jacketColor : '#2b7a78';
            const isAqua = config && config.gender === 'aqua';

            if (!isAqua) {
                // === SKIN KAZUMA ===
                // Mèche du haut
                ctx.fillStyle = '#221815'; ctx.fillRect(11, 0, 2, 2);
                ctx.fillStyle = '#6e4733'; ctx.fillRect(9, 2, 5, 2);

                // Cheveux Bruns
                ctx.fillStyle = '#6e4733';
                ctx.fillRect(5, 4, 13, 5);
                ctx.fillRect(3, 7, 16, 5);
                ctx.fillRect(2, 10, 4, 3);
                ctx.fillRect(17, 10, 4, 3);

                // Visage / Peau
                ctx.fillStyle = '#ffded0'; ctx.fillRect(5, 11, 13, 7);
                ctx.fillRect(4, 13, 14, 3);

                // Yeux Verts
                ctx.fillStyle = '#3db08e';
                ctx.fillRect(6, 14, 3, 2);
                ctx.fillRect(14, 14, 3, 2);

                // Cape / Vêtement (Couleur personnalisable)
                ctx.fillStyle = mainColor;
                ctx.fillRect(3, 18, 17, 8);
                ctx.fillRect(2, 22, 19, 5);

                // Col / Chemise Blanche & Ceinture
                ctx.fillStyle = '#ffffff'; ctx.fillRect(9, 18, 5, 5);
                ctx.fillStyle = '#e5a93c'; ctx.fillRect(3, 18, 17, 1); ctx.fillRect(3, 22, 17, 1);
                ctx.fillStyle = '#3a271d'; ctx.fillRect(6, 25, 11, 2);

                // Pantalon & Bottes
                ctx.fillStyle = '#ffffff'; ctx.fillRect(7, 27, 9, 2);
                ctx.fillStyle = '#3a271d'; ctx.fillRect(7, 29, 3, 3); ctx.fillRect(13, 29, 3, 3);

            } else {
                // === SKIN AQUA ===
                // Chignon & Accessoire bleu
                ctx.fillStyle = '#3a75c4'; ctx.fillRect(8, 0, 7, 3);
                ctx.fillStyle = '#9bdcf2'; ctx.fillRect(7, 1, 9, 2);

                // Cheveux Bleus
                ctx.fillStyle = '#9bdcf2';
                ctx.fillRect(4, 3, 15, 6);
                ctx.fillRect(3, 8, 17, 6);
                ctx.fillRect(2, 13, 3, 10); ctx.fillRect(18, 13, 3, 10); // Meches longues
                ctx.fillRect(19, 6, 4, 4); // Chignon coté

                // Visage
                ctx.fillStyle = '#ffded0'; ctx.fillRect(6, 10, 11, 6);
                // Yeux Bleus
                ctx.fillStyle = '#3a75c4';
                ctx.fillRect(7, 12, 2, 3);
                ctx.fillRect(14, 12, 2, 3);

                // Robe (Couleur personnalisable)
                ctx.fillStyle = mainColor;
                ctx.fillRect(5, 16, 13, 10);
                ctx.fillRect(3, 20, 17, 6);

                // Nœud / Poitrine & Ceinture
                ctx.fillStyle = '#ffffff'; ctx.fillRect(8, 17, 7, 5);
                ctx.fillStyle = '#e5a93c'; ctx.fillRect(6, 23, 11, 2);

                // Bottes Sombres
                ctx.fillStyle = '#221d3a'; ctx.fillRect(7, 26, 3, 5); ctx.fillRect(13, 26, 3, 5);
            }

            ctx.restore();
        }

        function drawPreview() {
            const pCanvas = document.getElementById('previewCanvas');
            const pCtx = pCanvas.getContext('2d');
            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
            drawPixelSprite(pCtx, 12, 10, charConfig, 3);
        }

        function startGame() {
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('gameArea').style.display = 'block';
            if (!socket) initGame();
        }

        function askExit() { openModal('confirmExitModal'); }

        function confirmExit() {
            closeModal('confirmExitModal');
            document.getElementById('gameArea').style.display = 'none';
            document.getElementById('mainMenu').style.display = 'block';
        }

        function openModal(id) { 
            document.getElementById(id).style.display = 'block'; 
            if(id === 'characterModal') drawPreview();
        }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        let socket, canvas, ctx;
        let players = {};
        let myId = null;

        function initGame() {
            socket = io();
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');

            socket.on('connect', () => { myId = socket.id; });
            socket.on('currentPlayers', (serverPlayers) => { players = serverPlayers; draw(); });
            socket.on('newPlayer', (data) => { players[data.id] = data.player; draw(); });
            socket.on('playerMoved', (data) => { if(players[data.id]) players[data.id] = data.player; draw(); });
            socket.on('disconnectPlayer', (id) => { delete players[id]; draw(); });

            window.addEventListener('keydown', (e) => {
                if (document.getElementById('gameArea').style.display === 'none') return;
                if (document.getElementById('confirmExitModal').style.display === 'block') return;
                if (!myId || !players[myId]) return;

                let moved = false;
                const speed = 6;
                if (e.key === 'ArrowUp' || e.key === 'z') { players[myId].y -= speed; moved = true; }
                if (e.key === 'ArrowDown' || e.key === 's') { players[myId].y += speed; moved = true; }
                if (e.key === 'ArrowLeft' || e.key === 'q') { players[myId].x -= speed; moved = true; }
                if (e.key === 'ArrowRight' || e.key === 'd') { players[myId].x += speed; moved = true; }

                if (moved) {
                    socket.emit('playerMovement', { 
                        x: players[myId].x, 
                        y: players[myId].y,
                        config: charConfig 
                    });
                    draw();
                }
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let id in players) {
                const p = players[id];
                drawPixelSprite(ctx, p.x, p.y, p.config || charConfig, 1.3);

                if (id === myId) {
                    ctx.fillStyle = '#00ffcc';
                    ctx.beginPath();
                    ctx.arc(p.x + 16, p.y - 6, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        window.onload = () => { drawPreview(); };
    </script>
</body>
</html>
